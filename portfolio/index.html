<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Coloring Book - Ages 2-5 (Part 2)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    
    .no-print {
      position: sticky; top: 0; background: #0f172a; color: white;
      padding: 1rem; text-align: center; z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .print-btn {
      background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem;
      font-size: 1rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer;
      margin-left: 1rem;
    }
    .print-btn:hover { background: #1d4ed8; }

    .book-container { display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 2rem 0; }
    
    .page {
      width: 8.5in; height: 11in; background: white; padding: 0.5in;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-radius: 4px; position: relative;
    }

    .page-header { text-align: center; width: 100%; }
    .page-title { font-size: 2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    
    .svg-container { width: 100%; height: 8.5in; display: flex; justify-content: center; align-items: center; }
    svg { width: 100%; height: 100%; }

    .page-footer { width: 100%; display: flex; justify-content: space-between; font-size: 0.875rem; color: #64748b; border-top: 2px dashed #cbd5e1; padding-top: 0.5rem; }

    @media print {
      body { background: white; }
      .no-print { display: none; }
      .book-container { padding: 0; gap: 0; }
      .page {
        width: 100vw; height: 100vh;
        box-shadow: none; border-radius: 0;
        page-break-after: always; page-break-inside: avoid;
      }
      @page { size: letter portrait; margin: 0; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <span><strong>My First Coloring Book (Pages 6–10)</strong> — Safari Animals</span>
    <button class="print-btn" onclick="window.print()">🖨️ Print All Pages / Save as PDF</button>
  </div>

  <div class="book-container">

    <!-- PAGE 6: FRIENDLY LION -->
    <div class="page">
      <div class="page-header">
        <h1 class="page-title">6. Friendly Lion</h1>
      </div>
      <div class="svg-container">
        <svg viewBox="0 0 500 650">
          <!-- Lion Mane (Cloud shape) -->
          <path d="M 250 100 C 330 100 370 140 400 180 C 450 200 480 260 450 320 C 480 390 440 460 380 480 C 350 540 280 560 250 550 C 220 560 150 540 120 480 C 60 460 20 390 50 320 C 20 260 50 200 100 180 C 130 140 170 100 250 100 Z" fill="white" stroke="black" stroke-width="12" stroke-linejoin="round"/>
          <!-- Lion Face -->
          <circle cx="250" cy="320" r="110" fill="white" stroke="black" stroke-width="12"/>
          <!-- Ears -->
          <path d="M 160 260 C 130 220 180 180 200 220" fill="white" stroke="black" stroke-width="10"/>
          <path d="M 340 260 C 370 220 320 180 300 220" fill="white" stroke="black" stroke-width="10"/>
          <!-- Eyes -->
          <circle cx="210" cy="290" r="14" fill="black"/>
          <circle cx="290" cy="290" r="14" fill="black"/>
          <!-- Nose -->
          <polygon points="230,330 270,330 250,360" fill="black"/>
          <!-- Mouth -->
          <path d="M 250 360 L 250 390 M 220 380 Q 250 410 280 380" fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/>
          <!-- Whiskers -->
          <line x1="130" y1="330" x2="180" y2="340" stroke="black" stroke-width="8" stroke-linecap="round"/>
          <line x1="130" y1="360" x2="180" y2="355" stroke="black" stroke-width="8" stroke-linecap="round"/>
          <line x1="370" y1="330" x2="320" y2="340" stroke="black" stroke-width="8" stroke-linecap="round"/>
          <line x1="370" y1="360" x2="320" y2="355" stroke="black" stroke-width="8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="page-footer">
        <span>My First Coloring Book</span>
        <span>Page 6</span>
      </div>
    </div>

    <!-- PAGE 7: CHUBBY HIPPO -->
    <div class="page">
      <div class="page-header">
        <h1 class="page-title">7. Chubby Hippo</h1>
      </div>
      <div class="svg-container">
        <svg viewBox="0 0 500 650">
          <!-- Ears -->
          <circle cx="160" cy="180" r="30" fill="white" stroke="black" stroke-width="12"/>
          <circle cx="340" cy="180" r="30" fill="white" stroke="black" stroke-width="12"/>
          <!-- Head Base -->
          <ellipse cx="250" cy="250" rx="110" ry="90" fill="white" stroke="black" stroke-width="12"/>
          <!-- Big Snout -->
          <ellipse cx="250" cy="380" rx="160" ry="110" fill="white" stroke="black" stroke-width="12"/>
          <!-- Eyes -->
          <circle cx="210" cy="230" r="12" fill="black"/>
          <circle cx="290" cy="230" r="12" fill="black"/>
          <!-- Nostrils -->
          <ellipse cx="180" cy="360" rx="15" ry="25" fill="black"/>
          <ellipse cx="320" cy="360" rx="15" ry="25" fill="black"/>
          <!-- Smile -->
          <path d="M 160 420 Q 250 500 340 420" fill="none" stroke="black" stroke-width="12" stroke-linecap="round"/>
          <!-- Teeth -->
          <rect x="210" y="455" width="25" height="30" rx="5" fill="white" stroke="black" stroke-width="8"/>
          <rect x="265" y="455" width="25" height="30" rx="5" fill="white" stroke="black" stroke-width="8"/>
        </svg>
      </div>
      <div class="page-footer">
        <span>My First Coloring Book</span>
        <span>Page 7</span>
      </div>
    </div>

    <!-- PAGE 8: TALL GIRAFFE -->
    <div class="page">
      <div class="page-header">
        <h1 class="page-title">8. Tall Giraffe</h1>
      </div>
      <div class="svg-container">
        <svg viewBox="0 0 500 650">
          <!-- Horns -->
          <line x1="210" y1="180" x2="200" y2="120" stroke="black" stroke-width="12" stroke-linecap="round"/>
          <line x1="290" y1="180" x2="300" y2="120" stroke="black" stroke-width="12" stroke-linecap="round"/>
          <circle cx="200" cy="110" r="15" fill="white" stroke="black" stroke-width="10"/>
          <circle cx="300" cy="110" r="15" fill="white" stroke="black" stroke-width="10"/>
          <!-- Ears -->
          <ellipse cx="140" cy="190" rx="40" ry="20" transform="rotate(-20 140 190)" fill="white" stroke="black" stroke-width="10"/>
          <ellipse cx="360" cy="190" rx="40" ry="20" transform="rotate(20 360 190)" fill="white" stroke="black" stroke-width="10"/>
          <!-- Neck & Body -->
          <path d="M 190 280 L 160 600 L 340 600 L 310 280 Z" fill="white" stroke="black" stroke-width="12" stroke-linejoin="round"/>
          <!-- Head -->
          <ellipse cx="250" cy="220" rx="70" ry="90" fill="white" stroke="black" stroke-width="12"/>
          <ellipse cx="250" cy="270" rx="80" ry="60" fill="white" stroke="black" stroke-width="12"/>
          <!-- Eyes -->
          <circle cx="220" cy="200" r="12" fill="black"/>
          <circle cx="280" cy="200" r="12" fill="black"/>
          <!-- Nostrils -->
          <circle cx="220" cy="280" r="8" fill="black"/>
          <circle cx="280" cy="280" r="8" fill="black"/>
          <!-- Smile -->
          <path d="M 220 310 Q 250 330 280 310" fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/>
          <!-- Spots -->
          <circle cx="250" cy="400" r="25" fill="white" stroke="black" stroke-width="10"/>
          <circle cx="200" cy="480" r="20" fill="white" stroke="black" stroke-width="10"/>
          <circle cx="300" cy="520" r="30" fill="white" stroke="black" stroke-width="10"/>
          <circle cx="240" cy="560" r="15" fill="white" stroke="black" stroke-width="10"/>
        </svg>
      </div>
      <div class="page-footer">
        <span>My First Coloring Book</span>
        <span>Page 8</span>
      </div>
    </div>

    <!-- PAGE 9: CHEEKY MONKEY -->
    <div class="page">
      <div class="page-header">
        <h1 class="page-title">9. Cheeky Monkey</h1>
      </div>
      <div class="svg-container">
        <svg viewBox="0 0 500 650">
          <!-- Tail -->
          <path d="M 330 450 C 450 400 450 550 380 580 C 330 600 350 520 380 540" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
          <!-- Ears -->
          <circle cx="130" cy="250" r="45" fill="white" stroke="black" stroke-width="12"/>
          <circle cx="130" cy="250" r="25" fill="white" stroke="black" stroke-width="8"/>
          <circle cx="370" cy="250" r="45" fill="white" stroke="black" stroke-width="12"/>
          <circle cx="370" cy="250" r="25" fill="white" stroke="black" stroke-width="8"/>
          <!-- Body -->
          <ellipse cx="250" cy="450" rx="100" ry="120" fill="white" stroke="black" stroke-width="12"/>
          <!-- Belly -->
          <ellipse cx="250" cy="470" rx="60" ry="70" fill="white" stroke="black" stroke-width="10"/>
          <!-- Head Outline -->
          <ellipse cx="250" cy="250" rx="120" ry="110" fill="white" stroke="black" stroke-width="12"/>
          <!-- Face Area -->
          <path d="M 170 230 C 170 170 330 170 330 230 C 360 300 330 340 250 340 C 170 340 140 300 170 230 Z" fill="white" stroke="black" stroke-width="10"/>
          <!-- Eyes -->
          <circle cx="210" cy="230" r="14" fill="black"/>
          <circle cx="290" cy="230" r="14" fill="black"/>
          <!-- Nose -->
          <ellipse cx="250" cy="270" rx="15" ry="10" fill="black"/>
          <!-- Mouth -->
          <path d="M 200 300 Q 250 330 300 300" fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="page-footer">
        <span>My First Coloring Book</span>
        <span>Page 9</span>
      </div>
    </div>

    <!-- PAGE 10: STRIPED ZEBRA -->
    <div class="page">
      <div class="page-header">
        <h1 class="page-title">10. Striped Zebra</h1>
      </div>
      <div class="svg-container">
        <svg viewBox="0 0 500 650">
          <!-- Ears -->
          <ellipse cx="190" cy="180" rx="20" ry="40" transform="rotate(-30 190 180)" fill="white" stroke="black" stroke-width="10"/>
          <ellipse cx="310" cy="180" rx="20" ry="40" transform="rotate(30 310 180)" fill="white" stroke="black" stroke-width="10"/>
          <!-- Mane -->
          <path d="M 250 120 C 270 180 250 250 250 280" fill="none" stroke="black" stroke-width="16" stroke-linecap="round" stroke-dasharray="10, 15"/>
          <!-- Head/Body Shape -->
          <path d="M 210 200 C 150 250 120 350 170 450 C 200 500 300 500 330 450 C 380 350 350 250 290 200 C 270 150 230 150 210 200 Z" fill="white" stroke="black" stroke-width="12"/>
          <!-- Snout -->
          <ellipse cx="250" cy="420" rx="70" ry="50" fill="white" stroke="black" stroke-width="12"/>
          <!-- Eyes -->
          <circle cx="210" cy="280" r="12" fill="black"/>
          <circle cx="290" cy="280" r="12" fill="black"/>
          <!-- Nostrils -->
          <circle cx="220" cy="410" r="8" fill="black"/>
          <circle cx="280" cy="410" r="8" fill="black"/>
          <!-- Smile -->
          <path d="M 220 440 Q 250 460 280 440" fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/>
          <!-- Outlined Stripes for Coloring -->
          <path d="M 145 320 Q 200 300 250 330" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
          <path d="M 355 320 Q 300 300 250 330" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
          <path d="M 160 370 Q 200 360 230 380" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
          <path d="M 340 370 Q 300 360 270 380" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="page-footer">
        <span>My First Coloring Book</span>
        <span>Page 10</span>
      </div>
    </div>

  </div>
</body>
</html>
